name: Release

# Linux-style: tag vX.Y.Z (or Release → Publish) → GitHub Release with tarballs + ELF + SHA256SUMS
# Local: make dist  ==  git archive -> zig-kernel-$VERSION.tar.{gz,xz}  (like `make tar-pkg`)
# Usage: git tag v0.2.0 && git push origin v0.2.0   — or —   GitHub → Releases → Draft → Publish
on:
  release:
    types: [published]
  push:
    tags: ["v*.*.*", "v*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            V=$(grep -Po '\.version\s*=\s*"\K[^"]+' build.zig.zon || echo "0.1.0")
            echo "VERSION=$V" >> $GITHUB_OUTPUT
            echo "TAG=v$V" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Build + test (hosted + bare-metal)
        run: |
          zig build test
          zig build -Doptimize=ReleaseSmall
          zig build qemu-bin -Doptimize=ReleaseSmall
          ls -lh zig-out/bin/
          file zig-out/bin/kernel-baremetal || true

      - name: Create Linux-style tarballs
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          DIST="zig-kernel-${VERSION}"
          rm -rf dist
          mkdir -p dist

          # 1) Source tarballs (kernel.org style: linux-6.x.tar.xz) — respects .gitattributes export-ignore
          git archive --format=tar --prefix="${DIST}/" HEAD | gzip -9 > "dist/${DIST}.tar.gz"
          git archive --format=tar --prefix="${DIST}/" HEAD | xz -9 -T0 > "dist/${DIST}.tar.xz"

          # 2) Binary tarball (bare-metal ELF + linker.ld for QEMU artifact verification)
          mkdir -p "dist/${DIST}-bin"
          test -s zig-out/bin/kernel-baremetal
          cp zig-out/bin/kernel-baremetal "dist/${DIST}-bin/"
          cp zig-out/bin/zig-kernel "dist/${DIST}-bin/" 2>/dev/null || true
          cp zig-out/bin/zig-kernel.exe "dist/${DIST}-bin/" 2>/dev/null || true
          cp linker.ld README.md "dist/${DIST}-bin/"
          tar -czf "dist/${DIST}-bin.tar.gz" -C dist "${DIST}-bin"
          tar -cJf "dist/${DIST}-bin.tar.xz" -C dist "${DIST}-bin"

          # 3) Checksums (like kernel.org SHA256SUMS)
          (cd dist && sha256sum *.tar.gz *.tar.xz > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat dist/SHA256SUMS
          ls -lh dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/SHA256SUMS
            zig-out/bin/kernel-baremetal
          generate_release_notes: true
          fail_on_unmatched_files: false
